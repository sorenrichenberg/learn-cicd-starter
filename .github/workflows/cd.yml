name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build Prod
        run: ./scripts/buildprod.sh

      - name: gcloud Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1030148656214/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@notely-512816.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build Docker Image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-512816/notely-ar-repo/notely:latest .

      - name: Migrate DB
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-512816/notely-ar-repo/notely --region us-central1 --allow-unauthenticated --project notely-512816 --max-instances=4
